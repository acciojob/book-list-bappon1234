<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<div class="container mt-4">
		<h1 class="display-4 text-center">My<span class="text-primary">Book</span>List</h1>

		<div class="form-group">
			<label for="title">Title</label>
			<input type="text" id="title" class="form-control mb-3">
			<label for="author">Author</label>
			<input type="text" id="author" class="form-control mb-3">
			<label for="isbn">ISBN#</label>
			<input type="text" id="isbn" class="form-control mb-3">

			<button type="submit" id="submit" class="btn btn-primary btn-block mt-2">Add Book</button>
		</div>

		<table class="table table-striped mt-5">
			<thead>
				<tr>
					<th>Title</th>
					<th>Author</th>
					<th>ISBN#</th>
					<th></th>
				</tr>
			</thead>
			<tbody id="book-list"></tbody>
		</table>
	</div>
	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
